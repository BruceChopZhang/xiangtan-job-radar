name: 湘潭招聘雷达
on:
  workflow_dispatch:
# 仅手动运行；没有定时任务。
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: recruitment-radar
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      RADAR_SAVE_SNAPSHOTS: '0'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 自动化测试
        run: python -m unittest discover -s tests -v

      - name: 网络诊断（不影响后续发布）
        continue-on-error: true
        timeout-minutes: 4
        shell: bash
        run: |
          python3 -u <<'PY'
          import json
          import os
          import socket
          import subprocess
          import sys
          import time
          from urllib.parse import urlsplit

          sites = [
              ('市人社局', 'https://xtrs.xiangtan.gov.cn/25937/index.htm'),
              ('湘潭县', 'https://www.xtx.gov.cn/6571/6606/6589/index.htm'),
              ('雨湖区', 'https://www.xtyh.gov.cn/2997/3008/3033/3040/3492/3796/index.htm'),
              ('公共对照 Cloudflare', 'https://www.cloudflare.com/'),
          ]
          dns_code = (
              'import socket,json,sys; '
              'r=socket.getaddrinfo(sys.argv[1],443,socket.AF_UNSPEC,socket.SOCK_STREAM); '
              'print(json.dumps(sorted(set((int(a[0]),a[4][0]) for a in r))))'
          )
          labels = {
              6: 'DNS解析失败',
              7: 'TCP连接失败',
              28: '请求超时',
              35: 'TLS握手失败',
              60: '证书校验失败',
          }
          proxy = any(os.environ.get(k) for k in (
              'HTTPS_PROXY', 'https_proxy', 'ALL_PROXY', 'all_proxy'
          ))
          print('代理变量存在：' + ('是' if proxy else '否') + '（不输出变量值）')
          print('本诊断直连；不修改爬虫或代理设置。若设置了代理，两者网络路径可能不同。')
          print('仅检查系统DNS、TCP 443、HTTPS；不重试、不跟随跳转、不关闭证书校验。')

          for name, url in sites:
              print(f'\n=== {name} | {url} ===', flush=True)
              host = urlsplit(url).hostname
              try:
                  dns = subprocess.run(
                      [sys.executable, '-c', dns_code, host],
                      capture_output=True, text=True, timeout=6
                  )
                  if dns.returncode:
                      print('DNS失败：' + dns.stderr.strip(), flush=True)
                      continue
                  addresses = json.loads(dns.stdout)
                  print('DNS成功：' + json.dumps(addresses, ensure_ascii=False), flush=True)
              except Exception as exc:
                  print(f'DNS诊断异常：{type(exc).__name__}: {exc}', flush=True)
                  continue

              for family, flag, label in (
                  (socket.AF_INET, '-4', 'IPv4'),
                  (socket.AF_INET6, '-6', 'IPv6')
              ):
                  ips = [ip for af, ip in addresses if af == family]
                  if not ips:
                      print(f'{label}：DNS未返回对应地址，跳过；不等于该协议网络故障。', flush=True)
                      continue

                  started = time.monotonic()
                  try:
                      with socket.socket(family, socket.SOCK_STREAM) as conn:
                          conn.settimeout(4)
                          conn.connect((ips[0], 443))
                      print(f'{label} TCP443成功：{ips[0]}，{time.monotonic()-started:.2f}秒', flush=True)
                  except Exception as exc:
                      print(f'{label} TCP443失败：{ips[0]}，{type(exc).__name__}: {exc}', flush=True)

                  try:
                      result = subprocess.run([
                          'curl', '--disable', flag, '--noproxy', '*',
                          '--silent', '--show-error',
                          '--connect-timeout', '4', '--max-time', '8',
                          '--proto', '=https',
                          '--user-agent',
                          'XiangtanRecruitmentRadar/0.1 (personal public-notice monitor)',
                          '--output', os.devnull,
                          '--write-out', '%{json}', url,
                      ], capture_output=True, text=True, timeout=10)
                      data = json.loads(result.stdout or '{}')
                      code = int(data.get('http_code', 0))
                      status = (
                          '已取得HTTP响应' if code else
                          labels.get(result.returncode, '未取得HTTP响应')
                      )
                      print(
                          f'{label} HTTPS：{status}；curl退出码={result.returncode}；'
                          f'HTTP={code or "无"}；对端IP={data.get("remote_ip") or "未知"}；'
                          f'总耗时={data.get("time_total", "未知")}秒',
                          flush=True
                      )
                      if result.stderr.strip():
                          print('原始错误：' + result.stderr.strip(), flush=True)
                      if data.get('redirect_url'):
                          print('重定向目标（未跟随）：' + data['redirect_url'], flush=True)
                  except Exception as exc:
                      print(f'{label} HTTPS诊断异常：{type(exc).__name__}: {exc}', flush=True)

          print('\n判读提示：HTTP403/429说明已收到响应，可能存在访问限制；503也可能是服务或网关异常。')
          print('对照站成功而三站失败，只能缩小到特定路径/站点；不能据此断言GitHub封锁或网站封禁。')
          print('IPv4成功、IPv6失败只提示协议差异；需结合DNS和TCP错误，不修改爬虫连接策略。')
          print('请复制本任务完整日志；以GitHub实跑结果为准。')
          PY

      - name: 恢复历史（失败则停止，禁止从空数据开始）
        id: restore
        run: python scripts/state.py restore

      - name: 抓取（失败仍保存日志）
        id: crawl
        continue-on-error: true
        run: python -m radar

      - name: 持久保存公告和日志到data分支
        id: save
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && (steps.crawl.outcome == 'success' || steps.crawl.outcome == 'failure') }}
        run: python scripts/state.py save
        env:
          RADAR_GITHUB_TOKEN: ${{ github.token }}

      - name: 保存失败时提供临时恢复备份（不是长期存储）
        if: ${{ !cancelled() && steps.save.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/radar.sqlite3
            data/logs.json
          retention-days: 30

      - name: 配置Pages
        if: ${{ success() && steps.save.outcome == 'success' }}
        uses: actions/configure-pages@v5

      - name: 上传Pages（仅静态网页）
        if: ${{ success() && steps.save.outcome == 'success' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: 发布网页
        id: deployment
        if: ${{ success() && steps.save.outcome == 'success' }}
        uses: actions/deploy-pages@v4

      - name: 明确标记本轮抓取失败
        if: ${{ !cancelled() && steps.crawl.outcome == 'failure' }}
        run: |
          echo '本轮抓取存在失败；请检查网页监测日志。'
          exit 1
